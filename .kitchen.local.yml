# Layered on top of the upstream facebook/chef-cookbooks .kitchen.yml by the
# reusable kitchen workflow (see .github/workflows/kitchen.yml). Upstream
# provides the driver and platform list; we only add our own suite.
provisioner:
  client_rb:
    # fb_users needs node['etc'], which comes from this optional plugin
    ohai.optional_plugins:
      - Passwd

suites:
  - name: local
    run_list:
      - recipe[test_services]
